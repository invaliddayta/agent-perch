    <path d="M970 107h14v14h-14z" fill="#090c12"/>
    <path d="M935 136h14v14h28v14h-42z" fill="#ad8017"/>
    <path d="M942 164h7v21h-21v-7h14zm35 0h7v21h-21v-7h14z" fill="#e89b24"/>
  </g>
