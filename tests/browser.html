<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>Perch browser checks</title>
    <style>
      #results {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
    </style>
  </head>
  <body>
    <pre id="results">Running browser checks...</pre>
    <script type="module">
      import { runBrowserChecks } from "./browser-checks.tsx";
      const results = document.querySelector("#results");
      runBrowserChecks()
        .then((checks) => {
          results.textContent = checks.join("\n");
          results.dataset.status = "passed";
        })
        .catch((error) => {
          results.textContent = error.stack;
          results.dataset.status = "failed";
        });
    </script>
  </body>
</html>
