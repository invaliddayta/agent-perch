name: Versioned release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  validate:
    strategy:
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"
      - name: Check version tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: bun -e 'import {releaseVersion} from "./scripts/package-release"; import p from "./package.json"; releaseVersion(process.env.RELEASE_TAG, p.version)'
      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun test --no-env-file
      - run: bun run build
      - uses: cachix/install-nix-action@v31
      - run: nix build --print-build-logs
      - name: Test installed Nix runtime with fake Pi and isolated tmux
        run: PERCH_TEST_PACKAGE_BIN="$PWD/result/bin/agent-perch" bun test --no-env-file tests/pi-terminal.test.ts tests/backend-integration.test.ts
      - name: Package prebuilt runtime
        if: matrix.runner == 'ubuntu-latest'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: bun scripts/package-release.ts "$RUNNER_TEMP/perch-release" "$RELEASE_TAG"
      - name: Test the extracted release without installed dependencies
        if: matrix.runner == 'ubuntu-latest'
        run: |
          cd "$RUNNER_TEMP/perch-release"
          sha256sum --check SHA256SUMS
          tar -xzf agent-perch-*-runtime.tar.gz
          launcher=$(find "$RUNNER_TEMP/perch-release" -path '*/bin/agent-perch' -type f)
          test -x "$launcher"
          cd "$GITHUB_WORKSPACE"
          PERCH_TEST_PACKAGE_BIN="$launcher" bun test --no-env-file tests/pi-terminal.test.ts tests/backend-integration.test.ts
      - uses: actions/upload-artifact@v4
        if: matrix.runner == 'ubuntu-latest'
        with:
          name: release-files
          path: |
            ${{ runner.temp }}/perch-release/*.tar.gz
            ${{ runner.temp }}/perch-release/SHA256SUMS
          if-no-files-found: error
  release:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-files
          path: release-files
      - name: Verify checksums and create versioned release
        working-directory: release-files
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          sha256sum --check SHA256SUMS
          gh release create "$RELEASE_TAG" --verify-tag --generate-notes --title "Agent Perch $RELEASE_TAG" ./*
